<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCADIA Hub | Galeria de Jogos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #0b0f17;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .card-glow {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-glow:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 30px -5px rgba(168, 85, 247, 0.35);
    }
  </style>
</head>
<body class="min-h-screen pb-16 flex flex-col justify-between">

  <div>
    <!-- Cabeçalho Principal -->
    <header class="text-center py-12 px-4 border-b border-gray-800/80 bg-gradient-to-b from-purple-950/30 via-purple-900/10 to-transparent">
      <div class="inline-flex items-center gap-2 px-3 py-1 bg-purple-500/10 text-purple-400 rounded-full text-xs font-semibold mb-4 border border-purple-500/20">
        <i class="fas fa-gamepad text-sm"></i> Mostra de Projetos de IA
      </div>

      <!-- Nome com destaque em IA -->
      <h1 class="text-4xl md:text-6xl font-black text-white tracking-tight">
        ARCAD<span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-400 to-indigo-400">IA</span> <span class="text-gray-400 font-light">Hub</span>
      </h1>
      
      <p class="mt-3 text-gray-400 max-w-2xl mx-auto text-sm md:text-base">
        Explore a galeria com os 15 jogos criados pelos alunos. Clique nos cards para jogar e testar cada uma das criações!
      </p>

      <!-- Barra de Pesquisa e Botão Aleatório -->
      <div class="mt-8 max-w-2xl mx-auto flex flex-col sm:flex-row gap-3 px-4">
        <div class="relative flex-1">
          <i class="fas fa-search absolute left-4 top-3.5 text-gray-500"></i>
          <input type="text" id="searchInput" placeholder="Buscar por nome do jogo ou autor..." 
                 class="w-full pl-11 pr-4 py-3 bg-gray-900/90 border border-gray-700/80 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-purple-500 transition shadow-inner text-sm">
        </div>
        <button onclick="playRandomGame()" class="px-6 py-3 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-semibold rounded-xl transition flex items-center justify-center gap-2 shadow-lg text-sm shrink-0 active:scale-95">
          <i class="fas fa-dice text-base"></i> Jogo Aleatório
        </button>
      </div>
    </header>

    <!-- Grid de Jogos Cadastrados -->
    <main class="max-w-7xl mx-auto px-4 mt-10">
      <div id="gamesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </main>
  </div>

  <!-- Rodapé -->
  <footer class="mt-16 text-center text-xs text-gray-600 border-t border-gray-800/60 pt-6">
    <p>ARCADIA Hub • Plataforma de Jogos da Turma</p>
  </footer>

  <script>
    const games = [
      {
        id: 1,
        title: "Jogo com IA",
        student: "Lívia Singer",
        description: "Projeto desenvolvido para testar a criação de jogos interativos utilizando ferramentas de IA.",
        icon: "fa-gamepad",
        gradient: "from-purple-600 to-indigo-600",
        url: "https://livia-singer08.github.io/jogo_com_IA/",
        likes: 0
      },
      {
        id: 2,
        title: "Dossiê Criminal",
        student: "AI Studio Project",
        description: "Um jogo investigativo e de mistério com narrativa interativa construído com auxílio de IA.",
        icon: "fa-user-secret",
        gradient: "from-red-600 to-amber-700",
        url: "https://dossie-criminal-arquivos-confidenciais.ai.studio/",
        likes: 0
      },
      {
        id: 3,
        title: "Casa das Inquietas",
        student: "Projeto Vercel",
        description: "Experiência interativa baseada em narrativa e exploração publicada na Vercel.",
        icon: "fa-ghost",
        gradient: "from-pink-600 to-purple-800",
        url: "https://casa-das-inquietas.vercel.app/",
        likes: 0
      },
      {
        id: 4,

        student: "Projeto Vercel",
        description: "Jogo temático do universo Star Wars focado em duelos espaciais/galácticos.",
        icon: "fa-jedi",
        gradient: "from-blue-600 to-cyan-500",
        url: "https://starwars-galactic-duel.vercel.app/",
        likes: 0
      },
      {
        id: 5,
        title: "BugHunter 3D",
        student: "Carlos Halb",
        description: "Jogo em 3D focado em caçar bugs, desenvolvido e hospedado no GitHub Pages.",
        icon: "fa-bug",
        gradient: "from-emerald-600 to-teal-700",
        url: "https://carloshalb.github.io/BugHunter3D/",
        likes: 0
      },
      {
        id: 6,
        title: "Viva A Sua Mente Game",
        student: "Mathias",
        description: "Repositório do projeto com código-fonte e mecânicas de jogo focadas em saúde mental.",
        icon: "fa-brain",
        gradient: "from-violet-600 to-fuchsia-700",
        url: "https://github.com/mathias625/VivaASuaMenteGame",
        likes: 0
      },
      {
        id: 7,
        title: "Moon Valley",
        student: "Letícia Doffsotta Souza",
        description: "Jogo de exploração e aventura ambientado em Moon Valley.",
        icon: "fa-moon",
        gradient: "from-indigo-700 to-purple-900",
        url: "https://leticiadoffsottasouza.github.io/Moon_Valley/",
        likes: 0
      },
      {
        id: 8,
        title: "Jogo IA",
        student: "kauaazxx",
        description: "Projeto experimental de desenvolvimento de jogo integrado com Inteligência Artificial.",
        icon: "fa-robot",

        likes: 0
      },
      {
        id: 9,
        title: "Super Senai Bros",
        student: "bruno18157",
        description: "Jogo inspirado no clássico das plataformas adaptado com a temática do SENAI.",
        icon: "fa-gamepad",
        gradient: "from-red-600 to-yellow-500",
        url: "https://bruno18157.github.io/super-senai-bros/",
        likes: 0
      },
      {
        id: 10,
        title: "Truco Web",
        student: "bruno18157",
        description: "Adaptativo do clássico jogo de cartas Truco desenvolvido para rodar no navegador.",
        icon: "fa-diamond",
        gradient: "from-emerald-700 to-amber-600",
        url: "https://bruno18157.github.io/Truco-Web-/",
        likes: 0
      },
      {
        id: 11,
        title: "Game IA",
        student: "leandrosaltorato",
        description: "Projeto focado em mecânicas de jogo e inteligência artificial aplicadas ao navegador.",
        icon: "fa-laptop-code",
        gradient: "from-blue-600 to-purple-700",

      },
      {
        id: 12,
        title: "FUT-IA",
        student: "julianopls",
        description: "Jogo de futebol interativo combinando simulação esportiva e inteligência artificial.",
        icon: "fa-futbol",
        gradient: "from-green-600 to-teal-800",
        url: "https://julianopls.github.io/FUT-IA/",
        likes: 0
      },
      {
        id: 13,
        title: "Genshin TCG",
        student: "Projeto Vercel",
        description: "Jogo de cartas baseado nas mecânicas de card game de Genshin Impact.",
        icon: "fa-clone",
        gradient: "from-purple-700 to-pink-600",
        url: "https://genshintcg.vercel.app/",
        likes: 0
      },
      {
        id: 14,
        title: "Doce Fábrica",
        student: "Projeto Vercel",
        description: "Jogo interativo de gerenciamento ou lógica focado em uma fábrica de doces.",
        icon: "fa-cookie-bite",
        gradient: "from-pink-500 to-rose-600",
        url: "https://doce-fabrica.vercel.app/",
        likes: 0
      },
      {
        id: 15,
        title: "Jogo SESI 3",
        student: "Projeto Vercel",
        description: "Projeto acadêmico desenvolvido para a disciplina/turma do SESI.",
        icon: "fa-graduation-cap",
        gradient: "from-blue-700 to-indigo-900",
        url: "https://jogo-sesi3.vercel.app/",
        likes: 0
      }
    ];

    function renderGames(items) {
      const grid = document.getElementById('gamesGrid');
      if (items.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500">Nenhum jogo encontrado com esse termo.</div>`;
        return;
      }

      grid.innerHTML = items.map(game => `
        <div class="bg-gray-900/80 border border-gray-800 rounded-2xl overflow-hidden card-glow flex flex-col justify-between">
          <div>
            <div class="h-36 bg-gradient-to-br ${game.gradient} flex items-center justify-center relative overflow-hidden">
              <i class="fas ${game.icon} text-6xl text-white/20 absolute -bottom-2 -right-2 transform rotate-12"></i>
              <div class="w-16 h-16 rounded-2xl bg-white/10 backdrop-blur-md border border-white/20 flex items-center justify-center text-white text-2xl shadow-lg">
                <i class="fas ${game.icon}"></i>
              </div>
            </div>

            <div class="p-5">
              <h3 class="text-xl font-bold text-white leading-snug">${game.title}</h3>
              <p class="text-xs font-medium text-purple-400 mt-1 mb-3">
                <i class="fas fa-user-circle mr-1"></i> Autor(a): <span class="text-purple-300 font-semibold">${game.student}</span>
              </p>
              <p class="text-gray-400 text-xs leading-relaxed line-clamp-3">${game.description}</p>
            </div>
          </div>

          <div class="px-5 pb-5 pt-3 border-t border-gray-800/60 flex items-center justify-between gap-3 mt-auto">
            <button onclick="toggleLike(${game.id})" class="flex items-center gap-1.5 text-xs text-gray-400 hover:text-pink-400 transition">
              <i class="far fa-heart text-pink-500"></i> <span id="like-${game.id}">${game.likes}</span>
            </button>

            <a href="${game.url}" target="_blank" rel="noopener noreferrer" 
               class="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold rounded-lg transition flex items-center gap-2 shadow">
              Acessar / Jogar <i class="fas fa-external-link-alt text-[10px]"></i>
            </a>
          </div>
        </div>
      `).join('');
    }

    function applySearch() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = games.filter(g => 
        g.title.toLowerCase().includes(query) || 
        g.student.toLowerCase().includes(query) ||
        g.description.toLowerCase().includes(query)
      );
      renderGames(filtered);
    }

    function playRandomGame() {
      const randomIndex = Math.floor(Math.random() * games.length);
      window.open(games[randomIndex].url, '_blank');
    }

    function toggleLike(id) {
      const game = games.find(g => g.id === id);
      if (game) {
        game.likes += 1;
        document.getElementById(`like-${id}`).innerText = game.likes;
      }
    }

    document.getElementById('searchInput').addEventListener('input', applySearch);
    renderGames(games);
  </script>
</body>
</html>
